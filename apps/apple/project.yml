name: CourseWise
options:
  bundleIdPrefix: com.coursewise
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true
  groupSortPosition: top
settings:
  base:
    DEVELOPMENT_TEAM: KQ77E3R6PM
    SWIFT_VERSION: 6.0
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
  configs:
    Debug:
      APNS_ENVIRONMENT: development
    Release:
      APNS_ENVIRONMENT: production
targets:
  CourseWise:
    type: application
    platform: iOS
    sources:
      - path: CourseWise
        excludes:
          - Resources
      - path: CourseWise/Resources
        excludes:
          - Info.plist
          - CourseWise.entitlements
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coursewise.app
        PRODUCT_NAME: CourseWise
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_FILE: CourseWise/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: CourseWise/Resources/CourseWise.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - CourseWiseTests
        - CourseWiseUITests
  CourseWiseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CourseWiseTests
    dependencies:
      - target: CourseWise
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coursewise.app.tests
        GENERATE_INFOPLIST_FILE: YES
  CourseWiseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - CourseWiseUITests
    dependencies:
      - target: CourseWise
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coursewise.app.uitests
        GENERATE_INFOPLIST_FILE: YES
